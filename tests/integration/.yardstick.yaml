# the Go yardstick's app config: every gate in gates/ reads its labels and SBOMs from these, in order.
# a later source wins on the same label, and new labels are written to the last one.
#   - the published anchore/claims corpus
#   - grype's quality gate labels (test/integration/additional-claims on grype main)
#   - this repo's own labels (tests/integration/additional-claims)
claims:
  - github.com/anchore/claims@main
  - github.com/anchore/grype/test/integration/additional-claims@main
  - ./additional-claims
