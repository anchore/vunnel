# the quality gate's tools, kept out of the repo root's .binny.yaml so that `make tools` (and the
# format, lint and type-check tasks that depend on it) never builds them. Installed into
# tests/quality/.tool by `make tools` in this directory.
tools:
  # used in quality gate to compare matching between the PR's DB and a published DB
  - name: yardstick
    version:
      # a go-rewrite commit until the Go yardstick is released
      want: ebf2565f57f9e37f6554d8560e931dc05c1f8050
    method: go-install
    with:
      module: github.com/anchore/yardstick
      entrypoint: cmd/yardstick
      env:
        # the python-era tags (latest v0.16.2) cannot be zipped by the go proxy, so the sumdb has no
        # entry for them and go install fails its deprecation lookup. GOPRIVATE skips the sumdb and
        # fetches straight from github at the pinned SHA instead. Drop this once v0.17.0 is tagged.
        - GOPRIVATE=github.com/anchore/yardstick

  # used in quality gate (both setups scan with this one binary)
  - name: grype
    version:
      want: main
    method: go-install
    with:
      module: github.com/anchore/grype
      entrypoint: cmd/grype
