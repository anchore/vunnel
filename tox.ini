[tox]
envlist = py313, py314, py315

[testenv]
allowlist_externals = uv
skip_install = true
# without this, uv ignores the tox env and syncs/runs the project's .venv,
# so every env would test against the same interpreter
setenv =
    UV_PROJECT_ENVIRONMENT = {envdir}

commands =
    uv sync --all-extras --dev
    uv run pytest --cov vunnel -v --durations=10 tests/unit/
