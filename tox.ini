[tox]
envlist = py313, py314, py315

[testenv]
# tox-uv's lock runner syncs uv.lock into each tox env (it sets UV_PROJECT_ENVIRONMENT and passes
# the env's interpreter), so every env tests on its own python. Calling `uv sync`/`uv run` from
# commands instead would use the project's .venv. See https://github.com/tox-dev/tox-uv#uvlock-support
runner = uv-venv-lock-runner
dependency_groups = dev

commands =
    pytest --cov vunnel -v --durations=10 tests/unit/ tests/integration/test_configure.py
