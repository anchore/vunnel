cooldown: 7d
tools:
  # we want to use a pinned version of binny to manage the toolchain (so binny manages itself!)
  - name: binny
    version:
      want: v0.13.4
    method: github-release
    with:
      repo: anchore/binny

  # used for running all local and CI tasks
  - name: task
    version:
      want: v3.54.0
    method: github-release
    with:
      repo: go-task/task

  # used for showing the changelog at release
  - name: glow
    version:
      want: v3.0.0
    method: github-release
    with:
      repo: charmbracelet/glow

  # used at release to generate the changelog
  - name: chronicle
    version:
      want: v0.13.1
    method: github-release
    with:
      repo: anchore/chronicle

  # used at release to generate the changelog
  - name: crane
    version:
      want: v0.22.1
    method: github-release
    with:
      repo: google/go-containerregistry

  # used in quality gate to pull cached provider data
  - name: oras
    version:
      want: v1.3.4
    method: github-release
    with:
      repo: oras-project/oras

  # used in quality gate to compare matching between the PR's DB and a published DB
  - name: yardstick
    version:
      # a go-rewrite commit until the Go yardstick is released
      want: ebf2565f57f9e37f6554d8560e931dc05c1f8050
    method: go-install
    with:
      module: github.com/anchore/yardstick
      entrypoint: cmd/yardstick
      env:
        # the python-era tags (latest v0.16.2) cannot be zipped by the go proxy, so the sumdb has no
        # entry for them and go install fails its deprecation lookup. GOPRIVATE skips the sumdb and
        # fetches straight from github at the pinned SHA instead. Drop this once v0.17.0 is tagged.
        - GOPRIVATE=github.com/anchore/yardstick

  # used in quality gate (both setups scan with this one binary)
  - name: grype
    version:
      want: main
    method: go-install
    with:
      module: github.com/anchore/grype
      entrypoint: cmd/grype
