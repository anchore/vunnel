version: 2
updates:

  - package-ecosystem: "github-actions"
    open-pull-requests-limit: 10
    directories:
      - "/"
      - "/.github/actions/*"
    # replaces dependabot's default labels, so github_actions is restated.
    # skip-quality-gate: action bumps don't change provider behavior, so don't pay for
    # the full provider quality gate (see .github/workflows/pr-quality-gate.yaml).
    labels:
      - "github_actions"
      - "skip-quality-gate"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7

  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    open-pull-requests-limit: 10
    ignore:
      # used to generate Mariner models.
      # pin to keep from introducing needless drift in the models.
      - dependency-name: "xsdata"
