rules:
  template-injection:
    ignore:
      # Allow provider name in step names for debugging purposes
      # These template expansions are not in shell execution context
      - actions/quality-gate/action.yaml:37  # Archive step name
      - actions/quality-gate/action.yaml:44  # Upload step name
      - actions/quality-gate/action.yaml:51  # Debug step name
      # Upload artifact uses provider in 'with:' section which is not shell execution
      - actions/quality-gate/action.yaml:48  # Artifact name
      - actions/quality-gate/action.yaml:49  # Artifact path
