name: "PR Integration Tests"
on:
  pull_request:
    types:
      # default types...
      - opened
      - synchronize
      - reopened
      # custom types...
      - labeled
      # so removing skip-integration-tests (or run-integration-tests) re-evaluates the tests
      # instead of leaving a stale result in place
      - unlabeled

permissions: {}

concurrency:
  group: pr-integration-tests-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  select-providers:
    # skip-integration-tests: nothing downstream runs; evaluate-integration-tests reports success.
    # dependabot applies it to github-actions bumps (see .github/dependabot.yml).
    if: ${{ !contains(github.event.pull_request.labels.*.name, 'skip-integration-tests') }}
    runs-on: runs-on=${{ github.run_id }}/cpu=2/ram=4+8/family=t4g+t3a+t3+m6g+m6a/spot=price-capacity-optimized/retry=when-interrupted
    permissions:
      contents: read
    outputs:
      providers: ${{ steps.determine-providers.outputs.providers }}
    steps:
      - uses: runs-on/action@17b59092eb37ebfdbb034460892887c09100eaa3 #v2.5.0
        if: ${{ vars.TRACK_RESOURCE_METRICS != '' }}
        with:
          metrics: ${{ vars.TRACK_RESOURCE_METRICS }}

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 #v7.0.1
        with:
          # in order to properly resolve the version from git
          fetch-depth: 0
          persist-credentials: false

      - name: Bootstrap environment
        uses: $/.github/actions/bootstrap
        with:
          tools: false

      - name: Determine providers
        id: determine-providers
        run: |
          # be nice to folks troubleshooting in CI...
          make integration:show-changes

          # determine which providers to run (to later populate the matrix)
          content=`make integration:select-providers`
          echo $content
          echo "providers=$content" >> $GITHUB_OUTPUT

  validate-provider:
    runs-on: runs-on=${{ github.run_id }}-provider-${{ strategy.job-index }}/cpu=8/ram=16+64/family=c6gd+c5ad+m6gd+c7gd+c5d+c6id+m5ad+m7gd+m5d+r6gd+m6id+r5ad+r7gd+r5d+r6id/spot=price-capacity-optimized/retry=when-interrupted
    timeout-minutes: 480
    needs: select-providers
    if: contains(github.event.pull_request.labels.*.name, 'run-integration-tests') && needs.select-providers.outputs.providers != '[]'

    strategy:
      matrix:
        provider: ${{fromJson(needs.select-providers.outputs.providers)}}
      fail-fast: false

    permissions:
      contents: read
      packages: read

    steps:
      - uses: runs-on/action@17b59092eb37ebfdbb034460892887c09100eaa3 #v2.5.0
        if: ${{ vars.TRACK_RESOURCE_METRICS != '' }}
        with:
          metrics: ${{ vars.TRACK_RESOURCE_METRICS }}

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 #v7.0.1
        with:
          # in order to properly resolve the version from git
          fetch-depth: 0
          persist-credentials: false

      - name: Bootstrap environment
        uses: $/.github/actions/bootstrap

      - name: Run quality gate
        uses: $/.github/actions/quality-gate
        with:
          provider: ${{ matrix.provider }}
        env:
          # needed as a secret for the github provider
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  evaluate-integration-tests:
    name: "Evaluate Integration Tests"
    runs-on: runs-on=${{ github.run_id }}/cpu=2/ram=4+8/family=t4g+t3a+t3+m6g+m6a/spot=price-capacity-optimized/retry=when-interrupted
    needs:
      - validate-provider
      - select-providers
    if: ${{ always() }}
    steps:
      - uses: runs-on/action@17b59092eb37ebfdbb034460892887c09100eaa3 #v2.5.0
        if: ${{ vars.TRACK_RESOURCE_METRICS != '' }}
        with:
          metrics: ${{ vars.TRACK_RESOURCE_METRICS }}

      - env:
          SKIP_INTEGRATION_TESTS: ${{ contains(github.event.pull_request.labels.*.name, 'skip-integration-tests') }}
          VALIDATION_STATUS: ${{ needs.validate-provider.result }}
          PROVIDERS_TO_TEST: ${{ needs.select-providers.outputs.providers }}
        run: |
          if [ "$SKIP_INTEGRATION_TESTS" == 'true' ]; then
            echo "🟢 Integration tests skipped! (the 'skip-integration-tests' label is applied)"
            exit 0
          fi
          echo "Validations Status: $VALIDATION_STATUS"
          echo "Providers that require testing: $PROVIDERS_TO_TEST"
          echo
          if [ "$PROVIDERS_TO_TEST" == '[]' ]; then
            echo "🟢 Integration tests passed! (no providers changed)"
            exit 0
          fi
          # "skipped" with providers in the list means the label is missing
          case "$VALIDATION_STATUS" in
            success) ;;
            skipped)
              echo "❌ Providers need testing but the job was skipped (missing label?)"
              fail=1
              ;;
            *) fail=1 ;;
          esac
          if [ "$fail" = 1 ]; then
            echo "🔴 Integration tests FAILED! 😭"
            echo
            echo "This could happen for a couple of reasons:"
            echo "  - A provider test failed, in which case see the logs in previous jobs for more details"
            echo "  - A required provider test was skipped. You might need to add the 'run-integration-tests' label to your PR to prevent skipping the test."
            exit 1
          fi
          echo "🟢 Integration tests passed! (all tests passed)"
