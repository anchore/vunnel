name: "Quality Gate"
description: "Run quality gate for a given provider"
inputs:
  provider:
    description: "Provider to check"
    required: true

runs:
  using: "composite"
  steps:
    # assume we have python and uv installed

    # required for magic-cache from runs-on to function with artifact upload/download (see https://runs-on.com/caching/magic-cache/#actionsupload-artifact-compatibility)
    - uses: runs-on/action@17b59092eb37ebfdbb034460892887c09100eaa3 # v2.5.0

    - name: Login to ghcr.io
      shell: bash
      env:
        GITHUB_ACTOR: ${{ github.actor }}
      run: |
        echo "$GITHUB_TOKEN" | .tool/oras login ghcr.io --username "$GITHUB_ACTOR" --password-stdin

    - name: Capture vulnerability results
      shell: bash
      working-directory: tests/quality
      env:
        PROVIDER: ${{ inputs.provider }}
      run: make capture provider="$PROVIDER"

    - name: Validate provider results
      shell: bash
      working-directory: tests/quality
      env:
        PROVIDER: ${{ inputs.provider }}
      run: make validate provider="$PROVIDER"

    - name: Archive the provider state (${{ inputs.provider }})
      if: ${{ failure() }}
      shell: bash
      env:
        PROVIDER: ${{ inputs.provider }}
      run: tar -czvf "qg-capture-state-$PROVIDER.tar.gz" -C tests/quality gates .yardstick/runs

    - name: Upload the provider state archive (${{ inputs.provider }})
      if: ${{ failure() }}
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: qg-capture-state-${{ inputs.provider }}
        path: qg-capture-state-${{ inputs.provider }}.tar.gz

    - name: Show instructions to debug (${{ inputs.provider }})
      if: ${{ failure() }}
      shell: bash
      env:
        PROVIDER: ${{ inputs.provider }}
      run: |
        ARCHIVE_BASENAME="qg-capture-state-$PROVIDER"

        cat << EOF >> $GITHUB_STEP_SUMMARY
        ## Troubleshooting '$PROVIDER' failed run

        The gate report is in the "Validate provider results" step log. The \`$ARCHIVE_BASENAME\` artifact holds the gate file and its scans (\`gates/$PROVIDER.yaml\`, \`.yardstick/runs/\`) for reading.

        A run records absolute paths, so to re-score or label it, reproduce it locally (needs \`make tools\` at the repo root):
        \`\`\`bash
        cd tests/quality
        make capture provider=$PROVIDER
        make validate provider=$PROVIDER
        \`\`\`

        Then label what changed in the UI (the label UI needs yardstick from the installer, not \`go install\`):
        \`\`\`bash
        yardstick claims serve $PROVIDER --claims ./claims --open
        \`\`\`
        EOF
